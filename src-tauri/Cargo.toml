[package]
name = "md-reader"
version = "0.3.2"
edition = "2021"

[lib]
name = "md_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
# watch feature：plugin:fs|watch 命令（外部修改自动刷新）由 #[cfg(feature = "watch")] 门控，不开则运行时报 Command watch not found
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 版本与 Cargo.lock 中 wry 传递依赖对齐
webview2-com = "0.38"
windows = "0.61"
